<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LITH ATELIER</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f5;
    color: #222;
}

nav {
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    background: #f7f7f5;
}

.logo {
    font-size: 18px;
    letter-spacing: 4px;
    font-weight: 500;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 32px;
}

nav a {
    text-decoration: none;
    color: #555;
    font-size: 12px;
    letter-spacing: 1px;
}

nav a:hover {
    color: #111;
}

.hero {
    min-height: calc(100vh - 90px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7% 10%;
    gap: 70px;
}

.hero-text {
    width: 45%;
}

.small {
    font-size: 11px;
    letter-spacing: 3px;
    color: #999;
    margin-bottom: 25px;
}

h1 {
    font-size: clamp(55px, 7vw, 105px);
    line-height: 0.9;
    font-weight: 400;
    letter-spacing: -4px;
    margin-bottom: 35px;
}

.description {
    max-width: 430px;
    color: #777;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 35px;
}

.button {
    display: inline-block;
    padding: 15px 24px;
    background: #292929;
    color: white;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 1px;
}

.hero-image {
    width: 50%;
}

.hero-image img {
    width: 100%;
    height: 600px;
    object-fit: cover;
    display: block;
}

@media (max-width: 800px) {

    nav {
        padding: 0 5%;
    }

    nav ul {
        gap: 12px;
    }

    nav a {
        font-size: 9px;
    }

    .hero {
        flex-direction: column;
        padding: 50px 7%;
    }

    .hero-text,
    .hero-image {
        width: 100%;
    }

    .hero-image img {
        height: 450px;
    }

    h1 {
        font-size: 65px;
    }
}
</style>
</head>

<body>

<nav>

    <div class="logo">
        LITH ATELIER
    </div>

    <ul>
        <li>
            <a href="#about">O NÁS</a>
        </li>

        <li>
            <a href="#projects">PROJEKTY</a>
        </li>

        <li>
            <a href="https://www.instagram.com/lithatelier/"
               target="_blank">
               INSTAGRAM
            </a>
        </li>

        <li>
            <a href="https://wa.me/420737966656"
               target="_blank">
               WHATSAPP
            </a>
        </li>
    </ul>

</nav>


<section class="hero" id="about">

    <div class="hero-text">

        <div class="small">
            HANDMADE DESIGN · CZECH REPUBLIC
        </div>

        <h1>
            LITH<br>
            ATELIER
        </h1>

        <p class="description">
            Originální designové stolky a nábytek tvořené ručně,
            s důrazem na detail, materiál a osobitý charakter.
        </p>

        <a href="#projects" class="button">
            PROHLÉDNOUT PROJEKTY
        </a>

    </div>


    <div class="hero-image">

        <img
            src="logo na stole.jpeg"
            alt="LITH ATELIER – designový stolek"
        >

    </div>

</section>


<section id="projects"></section>

</body>
</html>
